<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nowruz Club · Banner 0 (1200×630)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream:    #efebe7;
      --cream-dk: #e0d9d3;
      --page-bg:  #c8c0b9;
      --terra:    #c93d14;
      --dark:     #1a1210;
      --mid:      #6b5f58;
      --muted:    #a09590;
      --green:    #5e8f54;
      --blue:     #0d8fe5;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--page-bg);
      padding: 28px 24px 40px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-height: 100vh;
    }

    /* ── Toolbar ── */
    .toolbar {
      width: 1200px;
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .toolbar-hint {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .toolbar-btns { display: flex; gap: 8px; }

    .btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: filter 0.15s, transform 0.12s;
    }
    .btn:hover   { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active  { transform: translateY(0); }
    .btn:disabled { opacity: 0.55; cursor: wait; transform: none; }

    .btn-edit {
      background: rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.7);
    }
    .btn-edit.open {
      background: rgba(201,61,20,0.25);
      color: #ffb49a;
    }
    .btn-dl {
      background: var(--terra);
      color: white;
    }

    /* ── Banner ── */
    #banner {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--cream);
      display: flex;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    }

    .accent {
      width: 104px;
      background: var(--terra);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 0;
      flex-shrink: 0;
    }

    .accent-logo {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.3);
      display: block;
    }

    .accent-num {
      font-family: 'Fraunces', serif;
      font-size: 68px;
      font-weight: 900;
      color: white;
      line-height: 1;
      letter-spacing: -3px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px 56px 44px 52px;
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 72px;
      font-weight: 800;
      line-height: 0.92;
      color: var(--terra);
      letter-spacing: -2px;
      margin-bottom: 18px;
    }

    .title em { font-style: normal; color: var(--dark); }

    .tagline {
      font-size: 18px;
      color: var(--mid);
      font-weight: 600;
      line-height: 1.5;
    }

    .bottom {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 28px;
    }

    .sprint-timeline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 28px;
      margin-bottom: 20px;
    }

    .tl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 7px;
    }

    .tl-row.live { background: rgba(201,61,20,0.07); }

    .tl-left {
      display: flex;
      align-items: center;
      gap: 9px;
      flex: 1;
      min-width: 0;
    }

    .tl-code {
      font-size: 12px;
      font-weight: 900;
      min-width: 26px;
      color: var(--muted);
    }
    .tl-row.done .tl-code { color: var(--green); }
    .tl-row.live .tl-code { color: var(--terra); }

    .tl-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--mid);
    }
    .tl-row.live .tl-name { color: var(--dark); }

    .tl-dates {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    .tl-status {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--muted);
    }
    .tl-row.done .tl-status { color: var(--green); }
    .tl-row.live .tl-status { color: var(--terra); }

    .dates { display: flex; gap: 36px; }

    .date-flag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .date-main {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--dark);
      letter-spacing: -0.3px;
    }

    .date-tz {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      margin-top: 3px;
      letter-spacing: 2px;
    }

    .cta {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--blue);
      border-radius: 14px;
      padding: 20px 28px;
      color: white;
      text-decoration: none;
      flex-shrink: 0;
      transition: filter 0.15s;
    }
    .cta:hover { filter: brightness(1.1); }

    .cta-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
      opacity: 0.75;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .cta-handle {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .cta-icon { font-size: 32px; opacity: 0.85; }

    /* ── Editor ── */
    .editor {
      width: 1200px;
      max-width: 100%;
      background: var(--cream-dk);
      border-radius: 12px;
      padding: 22px 28px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
    }

    .e-col { display: flex; flex-direction: column; gap: 10px; }

    .e-sec-title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }

    .e-field { display: flex; flex-direction: column; gap: 3px; }

    .e-field label {
      font-size: 10px;
      font-weight: 700;
      color: var(--mid);
      letter-spacing: 0.5px;
    }

    .e-field input,
    .e-field select {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark);
      background: var(--cream);
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 7px;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .e-field input:focus,
    .e-field select:focus { border-color: var(--terra); }

    .time-inputs {
      display: grid;
      grid-template-columns: 42px 1fr 110px 68px 56px;
      gap: 5px;
      margin-bottom: 5px;
    }

    .time-inputs input {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--dark);
      background: var(--cream);
      border: 1.5px solid rgba(0,0,0,0.1);
      border-radius: 7px;
      padding: 6px 7px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .time-inputs input:focus { border-color: var(--terra); }
  </style>
</head>
<body>

  <div class="toolbar">
    <span class="toolbar-hint">banner0 · 1200 × 630</span>
    <div class="toolbar-btns">
      <button class="btn btn-edit" id="btn-edit" onclick="toggleEditor()">⚙ Edit</button>
      <button class="btn btn-dl" onclick="downloadPNG()">↓ Download PNG</button>
    </div>
  </div>

  <div id="banner">
    <div class="accent">
      <img src="logo.jpg" class="accent-logo" alt="Nowruz Club">
      <div class="accent-num" id="b-code"></div>
    </div>
    <div class="main">
      <div>
        <div class="eyebrow">Open Sprint · Fortnightly</div>
        <div class="title" id="b-title"></div>
        <div class="tagline" id="b-tagline"></div>
      </div>
      <div class="bottom">
        <div>
          <div class="sprint-timeline" id="b-strip"></div>
          <div class="dates" id="b-dates"></div>
        </div>
        <a class="cta" id="b-cta" href="#" target="_blank" rel="noopener">
          <div>
            <div class="cta-label">Join on Telegram</div>
            <div class="cta-handle" id="b-tg"></div>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="30" height="30" aria-hidden="true" style="display:block;opacity:.9;flex-shrink:0">
            <path fill="white" d="M28.9700376,63.3244248 C47.6273373,55.1957357 60.0684594,49.8368063 66.2934036,47.2476366 C84.0668845,39.855031 87.7600616,38.5708563 90.1672227,38.528 C90.6966555,38.5191258 91.8804274,38.6503351 92.6472251,39.2725385 C93.294694,39.7979149 93.4728387,40.5076237 93.5580865,41.0057381 C93.6433345,41.5038525 93.7494885,42.63857 93.6651041,43.5252052 C92.7019529,53.6451182 88.5344133,78.2034783 86.4142057,89.5379542 C85.5170662,94.3339958 83.750571,95.9420841 82.0403991,96.0994568 C78.3237996,96.4414641 75.5015827,93.6432685 71.9018743,91.2836143 C66.2690414,87.5912212 63.0868492,85.2926952 57.6192095,81.6896017 C51.3004058,77.5256038 55.3966232,75.2369981 58.9976911,71.4967761 C59.9401076,70.5179421 76.3155302,55.6232293 76.6324771,54.2720454 C76.6721165,54.1030573 76.7089039,53.4731496 76.3346867,53.1405352 C75.9604695,52.8079208 75.4081573,52.921662 75.0095933,53.0121213 C74.444641,53.1403447 65.4461175,59.0880351 48.0140228,70.8551922 C45.4598218,72.6091037 43.1463059,73.4636682 41.0734751,73.4188859 C38.7883453,73.3695169 34.3926725,72.1268388 31.1249416,71.0646282 C27.1169366,69.7617838 23.931454,69.0729605 24.208838,66.8603276 C24.3533167,65.7078514 25.9403832,64.5292172 28.9700376,63.3244248 Z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <div class="editor" id="editor" style="display:none">
    <div class="editor-grid">
      <div class="e-col">
        <div class="e-sec-title">Sprint</div>
        <div class="e-field">
          <label>Code (accent column)</label>
          <input type="text" id="f-code" oninput="cfg.sprint.code=this.value;render()">
        </div>
        <div class="e-field">
          <label>Ordinal (title)</label>
          <input type="text" id="f-ordinal" oninput="cfg.sprint.ordinal=this.value;render()">
        </div>
        <div class="e-field">
          <label>Phase (title)</label>
          <input type="text" id="f-phase" oninput="cfg.sprint.phase=this.value;render()">
        </div>
        <div class="e-field">
          <label>Active sprint</label>
          <select id="f-active" onchange="setActive(this.value);render()"></select>
        </div>
        <div class="e-field">
          <label>Tagline</label>
          <input type="text" id="f-tagline" oninput="cfg.tagline=this.value;render()">
        </div>
        <div class="e-field">
          <label>Telegram handle</label>
          <input type="text" id="f-telegram" oninput="cfg.telegram=this.value;render()">
        </div>
      </div>
      <div class="e-col">
        <div class="e-sec-title">Times &nbsp;<small style="font-size:9px;letter-spacing:2px;opacity:.6">FLAG · PLACE · DAY · TIME · TZ</small></div>
        <div id="times-editor"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    let cfg = JSON.parse(JSON.stringify(CONFIG));
    let editorOpen = false;

    function render() {
      document.getElementById('b-code').textContent  = cfg.sprint.code;
      document.getElementById('b-title').innerHTML   = `Sprint<br>${cfg.sprint.ordinal}<br>${cfg.sprint.phase}`;
      document.getElementById('b-tagline').textContent = cfg.tagline;

      document.getElementById('b-dates').innerHTML = cfg.times.map(t => `
        <div class="date-block">
          <div class="date-flag">${t.flag} ${t.place}</div>
          <div class="date-main">${t.day} · ${t.time}</div>
          <div class="date-tz">${t.tz} · ${t.utc}</div>
        </div>
      `).join('');

      document.getElementById('b-cta').href = `https://t.me/${cfg.telegram}`;
      document.getElementById('b-tg').textContent = `t.me/${cfg.telegram}`;

      document.getElementById('b-strip').innerHTML = cfg.sprints.map(s => `
        <div class="tl-row ${s.status}">
          <div class="tl-left">
            <span class="tl-code">${s.code}</span>
            <span class="tl-name">${s.name}</span>
            <span class="tl-dates">${s.dates}</span>
          </div>
          <span class="tl-status">${
            s.status === 'done' ? '✓' :
            s.status === 'live' ? '● Live' : 'Soon'
          }</span>
        </div>
      `).join('');
    }

    function toggleEditor() {
      editorOpen = !editorOpen;
      document.getElementById('editor').style.display = editorOpen ? 'block' : 'none';
      document.getElementById('btn-edit').classList.toggle('open', editorOpen);
      document.getElementById('btn-edit').textContent = editorOpen ? '✕ Close' : '⚙ Edit';
      if (editorOpen) populateEditor();
    }

    function populateEditor() {
      document.getElementById('f-code').value    = cfg.sprint.code;
      document.getElementById('f-ordinal').value = cfg.sprint.ordinal;
      document.getElementById('f-phase').value   = cfg.sprint.phase;
      document.getElementById('f-tagline').value  = cfg.tagline;
      document.getElementById('f-telegram').value = cfg.telegram;

      document.getElementById('f-active').innerHTML = cfg.sprints.map(s =>
        `<option value="${s.code}"${s.status==='live'?' selected':''}>${s.code} – ${s.name}</option>`
      ).join('');

      document.getElementById('times-editor').innerHTML = cfg.times.map((t, i) => `
        <div class="time-inputs">
          <input type="text" value="${t.flag}"  title="Flag emoji" oninput="cfg.times[${i}].flag=this.value;render()">
          <input type="text" value="${t.place}" title="Place"      oninput="cfg.times[${i}].place=this.value;render()">
          <input type="text" value="${t.day}"   title="Day"        oninput="cfg.times[${i}].day=this.value;render()">
          <input type="text" value="${t.time}"  title="Time"       oninput="cfg.times[${i}].time=this.value;render()">
          <input type="text" value="${t.tz}"    title="TZ"         oninput="cfg.times[${i}].tz=this.value;render()">
        </div>
      `).join('');
    }

    function setActive(activeCode) {
      let found = false;
      cfg.sprints = cfg.sprints.map(s => {
        if (s.code === activeCode) { found = true; return {...s, status: 'live'}; }
        return {...s, status: found ? 'soon' : 'done'};
      });
    }

    async function downloadPNG() {
      const btn = document.querySelector('.btn-dl');
      btn.textContent = '⏳ Generating…';
      btn.disabled = true;
      try {
        await document.fonts.ready;
        const canvas = await html2canvas(document.getElementById('banner'), {
          scale: 1, useCORS: true, allowTaint: true, logging: false,
          width: 1200, height: 630, backgroundColor: null,
        });
        const a = document.createElement('a');
        a.download = `nowruz-${cfg.sprint.code.toLowerCase()}-${cfg.sprint.phase.toLowerCase()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      } finally {
        btn.textContent = '↓ Download PNG';
        btn.disabled = false;
      }
    }

    render();
  </script>
</body>
</html>
